[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "mixed-line-ending" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --", language = "system", types = [
        "rust",
    ], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings", language = "system", types = [
        "rust",
    ], pass_filenames = false },
    { id = "cargo-test", name = "cargo test", entry = "cargo test --workspace --all-targets --all-features", language = "system", types = [
        "rust",
    ], stages = ["pre-push"], pass_filenames = false },
]
